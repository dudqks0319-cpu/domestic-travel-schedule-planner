name = "tripmate-api-worker"
main = "src/index.ts"
compatibility_date = "2026-06-17"

[vars]
ENVIRONMENT = "local"
CORS_ALLOWED_ORIGINS = "http://localhost:8081,http://127.0.0.1:8081"

[[d1_databases]]
binding = "DB"
database_name = "tripmate-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PROVIDER_CACHE"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "SHARE_ASSETS"
bucket_name = "tripmate-share-assets-local"

[env.preview]
name = "tripmate-api-worker-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
CORS_ALLOWED_ORIGINS = "https://preview.tripmate.example"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tripmate-preview"
database_id = "replace-with-preview-d1-id"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "PROVIDER_CACHE"
id = "replace-with-preview-kv-id"
preview_id = "replace-with-preview-kv-preview-id"

[[env.preview.r2_buckets]]
binding = "SHARE_ASSETS"
bucket_name = "tripmate-share-assets-preview"

[env.production]
name = "tripmate-api-worker"

[env.production.vars]
ENVIRONMENT = "production"
CORS_ALLOWED_ORIGINS = "https://tripmate.example"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tripmate-production"
database_id = "replace-with-production-d1-id"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "PROVIDER_CACHE"
id = "replace-with-production-kv-id"

[[env.production.r2_buckets]]
binding = "SHARE_ASSETS"
bucket_name = "tripmate-share-assets"
